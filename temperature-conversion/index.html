<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Conversion</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Temperature Conversion:</h1>
        <input type="number" value="0" id="input-field"> <br>
        <div id="radio-btn">
            <input type="radio" name="temp-type" id="to-fahrenheit" value="celsius">
            <label for="celsius" id="lab1">celsius --> Fahrenheit</label> <br>
            <input type="radio" name="temp-type" id="to-celsius" value="fahrenheit">
            <label for="fahrenheit" id="lab2">Fahrenheit --> celsius</label> <br>
        </div>
        <button type="submit" id="btn-submit">Submit</button> <br>
        <label id="result"></label>
        
    </div>
    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Temperature Conversion</title>
    <link type="stylesheet" href="style.css">
</head>
<body>
    <div id="container">
        <h1>Temperature Conversion:</h1>
        <input type="number" value="0" id="input-field"> <br>
        <form></form>
        <input type="radio" name="temp-type" id="celsius" value="celsius">
        <label for="celsius" id="lab1">celsius --> Fahrenheit</label> <br>
        <input type="radio" name="temp-type" id="fahrenheit" value="fahrenheit">
        <label for="fahrenheit" id="lab2">Fahrenheit --> celsius</label> <br>
        </form>
        <button type="submit" id="btn-submit">Submit</button> <br>
        <label id="result"></label>
        
    </div>
</body>
</html>
